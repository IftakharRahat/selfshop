# Force PHP-only provider (prevents node/pnpm from package.json detection)
providers = ["php"]

# Only run composer install — skip pnpm
[phases.install]
cmds = ["composer install --ignore-platform-reqs"]

# Only run Laravel optimize — skip pnpm build
[phases.build]
cmds = ["php artisan optimize:clear || true"]

# Explicitly use PHP-FPM + Nginx start (not node)
[start]
cmd = "([ -e /app/storage ] && chmod -R ugo+w /app/storage); perl /assets/transform-config.pl /assets/nginx.template /nginx.conf && (php-fpm -y /assets/php-fpm.conf & nginx -c /nginx.conf)"
