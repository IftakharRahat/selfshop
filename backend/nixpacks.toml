# Force PHP-only provider (prevents node/pnpm from package.json detection)
providers = ["php"]

# Only run composer install — skip pnpm
[phases.install]
cmds = ["composer install --ignore-platform-reqs"]

# Clear all caches, then only cache config + views (NOT routes).
# Route caching is skipped because karim007/laravel-bkash and
# karim007/laravel-bkash-tokenize both register a route named
# "bkash-refund", which causes route:cache to fail and can leave
# a corrupt cache file that breaks ALL routes with 500 errors.
[phases.build]
cmds = [
    "php artisan optimize:clear || true",
    "php artisan config:cache || true",
    "php artisan view:cache || true",
    "php artisan route:clear",
]

# Explicitly use PHP-FPM + Nginx start (not node)
# route:clear runs at startup to remove any corrupt route cache left by
# Coolify's built-in optimize step (route:cache fails due to duplicate
# bkash-refund route name from two packages).
[start]
cmd = "php artisan route:clear; ([ -e /app/storage ] && chmod -R ugo+w /app/storage); perl /assets/transform-config.pl /assets/nginx.template /nginx.conf && (php-fpm -y /assets/php-fpm.conf & nginx -c /nginx.conf)"

